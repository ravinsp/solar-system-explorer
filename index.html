<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --space: #03050F;
    --panel: rgba(16, 22, 54, 0.78);
    --panel-solid: rgba(14, 19, 48, 0.94);
    --line: rgba(160, 176, 255, 0.18);
    --ink: #F1F3FF;
    --muted: #A7AFD8;
    --sun: #FFC23D;
    --sun-ink: #2A1A00;
    --sky: #62D8F0;
    --sky-soft: rgba(98, 216, 240, 0.16);
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  /* Make the hidden attribute always win, even over display rules below */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--space);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; touch-action: none; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .glass {
    background: var(--panel);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  /* ---------- Top bar ---------- */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; flex-wrap: wrap;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { border-radius: 18px; padding: 10px 16px 11px; display: grid; gap: 2px; min-width: 0; }
  .brand h1 {
    margin: 0; font-family: var(--display); font-weight: 800;
    font-size: 22px; line-height: 1.05; letter-spacing: 0.2px;
  }
  .brand h1 span { color: var(--sun); }
  .date { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .when b { color: var(--ink); font-weight: 800; }

  .toggles { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    height: 38px; padding: 0 14px; border-radius: 999px;
    font-weight: 800; font-size: 14px; white-space: nowrap;
  }
  .pill svg { width: 16px; height: 16px; flex: none; }
  .pill:hover { border-color: rgba(160, 176, 255, 0.4); }
  .pill[aria-pressed="true"] { background: var(--sky-soft); border-color: var(--sky); color: #DDF8FF; }
  .pill.tour[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); }

  /* ---------- Planet bar (bottom centre) ---------- */
  /* Corner panels sit above the planet bar on narrower screens */
  :root { --corner-b: calc(var(--chips-h, 38px) + 18px + env(safe-area-inset-bottom, 0px)); }

  .chips {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: calc(100% - 32px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 2px;
    padding: 3px; border-radius: 18px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    height: 28px; padding: 0 10px 0 6px; border-radius: 999px;
    font-weight: 800; font-size: 12.5px;
  }
  .chip:hover { background: rgba(255, 255, 255, 0.07); }
  .chip .dot { border-radius: 50%; flex: none; box-shadow: inset -2px -2px 3px rgba(0, 0, 0, 0.35); }
  .chip[aria-current="true"] { background: var(--sun); color: var(--sun-ink); }
  .chip-sep { flex: none; width: 1px; margin: 5px 4px; background: var(--line); }

  /* ---------- Time controls (bottom-right corner) ---------- */
  .transport {
    position: fixed; z-index: 5; right: 16px; bottom: var(--corner-b);
    display: grid; gap: 4px; padding: 6px; border-radius: 16px;
  }
  .trow { display: flex; align-items: center; gap: 4px; }
  .tbtn {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.06);
  }
  .tbtn:hover { background: rgba(255, 255, 255, 0.12); }
  .tbtn svg { width: 15px; height: 15px; }
  .tbtn[aria-pressed="true"] { background: var(--sky-soft); color: #DDF8FF; box-shadow: inset 0 0 0 2px var(--sky); }
  .tbtn.play { width: 38px; height: 38px; background: var(--sun); color: var(--sun-ink); }
  .tbtn.play:hover { background: #FFD266; }
  .tbtn.play svg { width: 18px; height: 18px; }
  .today {
    height: 28px; padding: 0 10px; margin-left: auto; border-radius: 999px;
    font-weight: 800; font-size: 12px; background: rgba(255, 255, 255, 0.06);
  }
  .today:hover { background: rgba(255, 255, 255, 0.12); }

  .speed { background: rgba(0, 0, 0, 0.28); border-radius: 999px; padding: 2px; }
  .step {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    font-weight: 800; font-size: 16px; line-height: 1; background: rgba(255, 255, 255, 0.08);
  }
  .step:hover:not(:disabled) { background: var(--sky); color: #04222B; }
  .step:disabled { opacity: 0.3; cursor: default; }
  .speed-txt {
    flex: 1; min-width: 150px; text-align: center; white-space: nowrap;
    font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums;
  }

  /* When the whole planet bar fits between them, the corner panels drop down level with it */
  :root.corners-low { --corner-b: calc(10px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- Fly pad (bottom-left corner) ---------- */
  .pad {
    position: fixed; z-index: 4; left: 16px; bottom: var(--corner-b);
    display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px);
    gap: 3px; padding: 5px; border-radius: 16px;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .pad button {
    border-radius: 10px; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.07);
  }
  .pad button:hover { background: rgba(255, 255, 255, 0.13); }
  .pad button.held { background: var(--sky); color: #04222B; }
  .pad svg { width: 14px; height: 14px; }
  .pad .mid { display: grid; place-items: center; font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .pad [data-dir="f"] { grid-area: 1 / 2; }
  .pad [data-dir="l"] { grid-area: 2 / 1; }
  .pad .mid { grid-area: 2 / 2; }
  .pad [data-dir="r"] { grid-area: 2 / 3; }
  .pad [data-dir="b"] { grid-area: 3 / 2; }
  .pad [data-dir="u"] { grid-area: 1 / 3; font-size: 10px; font-weight: 800; }
  .pad [data-dir="d"] { grid-area: 3 / 3; font-size: 10px; font-weight: 800; }

  /* ---------- Info card ---------- */
  .card {
    position: fixed; z-index: 6; right: 16px;
    top: calc(96px + env(safe-area-inset-top, 0px));
    width: 340px;
    max-height: calc(100% - 96px - var(--dock-h, 150px) - 36px);
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel-solid);
    border-radius: 24px; padding: 18px 18px 16px;
  }
  .card-head { display: flex; gap: 14px; align-items: center; }
  .orb { width: 54px; height: 54px; border-radius: 50%; flex: none; }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sky); }
  .card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }
  .close {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.07);
  }
  .close:hover { background: rgba(255, 255, 255, 0.14); }
  .close svg { width: 16px; height: 16px; }
  .fun { margin: 14px 0 0; font-size: 16px; line-height: 1.45; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 14px 0 0; font-size: 14px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-weight: 800; text-align: right; }
  .sizebox { margin-top: 14px; padding: 10px 12px 6px; border-radius: 16px; background: rgba(0, 0, 0, 0.25); }
  .sizebox p { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
  .sizebox svg { display: block; width: 100%; height: auto; }
  .scale-note { margin: 12px 0 0; font-size: 13.5px; line-height: 1.4; padding: 10px 12px; border-radius: 14px; background: rgba(255, 194, 61, 0.12); color: #FFE3A3; }
  .moons { margin-top: 14px; }
  .moons h3 { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .moons .list { display: flex; flex-wrap: wrap; gap: 6px; }
  .mchip {
    height: 32px; padding: 0 12px; border-radius: 999px; font-weight: 800; font-size: 13px;
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
  }
  .mchip:hover { background: var(--sky-soft); border-color: var(--sky); }
  .moons small { display: block; margin-top: 8px; font-size: 12.5px; color: var(--muted); }

  /* ---------- 3D labels ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  .label {
    position: absolute; left: 0; top: 0;
    padding: 2px 9px; border-radius: 999px;
    font-weight: 800; font-size: 13px; white-space: nowrap;
    background: rgba(5, 8, 24, 0.55); color: var(--ink);
    pointer-events: auto; will-change: transform;
  }
  .label:hover { background: rgba(98, 216, 240, 0.3); }
  .label.moon { font-size: 11.5px; font-weight: 700; color: #C9D0F2; padding: 1px 7px; }
  .label.region {
    background: transparent; color: var(--sky); font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 1px 4px #000;
  }
  .label.active { background: var(--sun); color: var(--sun-ink); text-shadow: none; }

  /* ---------- Loading ---------- */
  .loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: var(--space); font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--muted);
    padding-inline: 16px; text-align: center;
  }

  @media (max-width: 760px) {
    .brand h1 { font-size: 18px; }
    .date { font-size: 16px; }
    .pill { height: 34px; padding: 0 11px; font-size: 13px; }
    .pill .txt-long { display: none; }
    .card {
      left: 16px; right: 16px; width: auto; top: auto;
      bottom: calc(var(--dock-h, 150px) + 8px);
      max-height: 44vh;
    }
    .card h2 { font-size: 28px; }
    body.card-open .pad { display: none; }
  }
</style>

<div class="loading" id="loading">Building the solar system&hellip;</div>

<div id="scene"></div>
<div id="labels"></div>

<header class="top">
  <div class="brand glass">
    <h1>Solar System <span>Explorer</span></h1>
    <div class="date" id="date">&nbsp;</div>
    <div class="when" id="when">&nbsp;</div>
  </div>
  <div class="toggles">
    <button class="pill glass" id="btnOrbits" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="5"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
      Orbits
    </button>
    <button class="pill glass" id="btnNames" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
      Names
    </button>
    <button class="pill glass" id="btnOverview" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      Planets
    </button>
    <button class="pill glass tour" id="btnTour" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2c3 2.5 4.5 6 4.5 10L12 17l-4.5-5C7.5 8 9 4.5 12 2z"/><path d="M7.5 12 5 15l2.5 1M16.5 12l2.5 3-2.5 1M10 20l2 2 2-2"/><circle cx="12" cy="9" r="1.6"/></svg>
      <span id="tourTxt">Grand tour</span>
    </button>
  </div>
</header>

<aside class="card glass" id="card" hidden aria-live="polite"></aside>

<div class="pad glass" id="pad" aria-label="Fly controls">
  <button data-dir="f" aria-label="Fly forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 10H5z"/></svg></button>
  <button data-dir="l" aria-label="Fly left"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 12l10-7v14z"/></svg></button>
  <div class="mid">Fly</div>
  <button data-dir="r" aria-label="Fly right"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12L9 5v14z"/></svg></button>
  <button data-dir="b" aria-label="Fly backward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 19l7-10H5z"/></svg></button>
  <button data-dir="u" aria-label="Fly up">Up</button>
  <button data-dir="d" aria-label="Fly down">Down</button>
</div>

<nav class="chips glass" id="chips" aria-label="Visit a place"></nav>

<div class="transport glass" id="transport">
  <div class="trow">
    <button class="tbtn" id="btnBack" aria-pressed="false" aria-label="Go backwards in time" title="Backwards in time">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2 12zM21 6v12l-9-6z"/></svg>
    </button>
    <button class="tbtn play" id="btnPlay" aria-label="Pause" title="Play / pause (Space)">
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="tbtn" id="btnFwd" aria-pressed="true" aria-label="Go forwards in time" title="Forwards in time">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l9-6zM3 6v12l9-6z"/></svg>
    </button>
    <button class="today" id="btnToday" title="Jump back to today's date">Today</button>
  </div>
  <div class="trow speed" role="group" aria-label="Time speed">
    <button class="step" id="btnSlower" aria-label="Slower" title="Slower">&minus;</button>
    <span class="speed-txt" id="speedTxt" aria-live="polite">1 sec = 1 week</span>
    <button class="step" id="btnFaster" aria-label="Faster" title="Faster">+</button>
  </div>
</div>

  /* =========================================================

  function rng(seed) {
    seed = (seed % 2147483647) || 1;

  }

  // Smooth noise that wraps left-to-right, so the sphere has no seam
  function makeNoise(seed) {
    var r = rng(seed), g = new Float32Array(256 * 256);
    for (var i = 0; i < g.length; i++) g[i] = r();
    function n(x, y, p) {
      var fx = x * p, fy = y * p * 0.5;
      var ix = Math.floor(fx), iy = Math.floor(fy);
      var tx = fx - ix, ty = fy - iy;
      var sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      var x0 = ix % p, x1 = (ix + 1) % p, y0 = iy & 255, y1 = (iy + 1) & 255;
      var a = g[y0 * 256 + x0], b = g[y0 * 256 + x1], c = g[y1 * 256 + x0], d = g[y1 * 256 + x1];
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;

      ctx.beginPath(); ctx.ellipse(w * 0.62, h * 0.64, w * 0.045, h * 0.04, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(214,128,86,0.8)";
      ctx.beginPath(); ctx.ellipse(w * 0.62, h * 0.64, w * 0.025, h * 0.022, 0, 0, TAU); ctx.fill();

      ctx.beginPath(); ctx.ellipse(w * 0.3, h * 0.62, w * 0.035, h * 0.035, 0, 0, TAU); ctx.fill();
    }
    return c;
  }

  /* =========================================================

  /* =========================================================

  function pxScale() { return renderer.getPixelRatio() * window.innerHeight / 2 / Math.tan(camera.fov * DEG / 2); }
  var pointMats = [];

  var POINT_VS = [
    "#include <common>",
    "#include <logdepthbuf_pars_vertex>",
    "attribute vec3 aColor;",
    "attribute float aSize;",
    "uniform float uScale;",
    "uniform float uMaxPx;",
    "uniform float uNear0;",
    "uniform float uNear1;",
    "uniform float uOpacity;",
    "varying vec3 vColor;",
    "varying float vAlpha;",
    "void main() {",
    "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
    "  float px = aSize * uScale / max(-mv.z, 0.001);",
    // Fade out points right next to the camera
    "  float a = uOpacity * smoothstep(uNear0, uNear1, length(mv.xyz));",
    // Tiny points stay visible, just dimmer
    "  if (px < 1.5) { a *= px / 1.5; px = 1.5; }",
    "  gl_PointSize = min(px, uMaxPx);",
    "  vColor = aColor;",
    "  vAlpha = a;",
    "  gl_Position = projectionMatrix * mv;",
    "  #include <logdepthbuf_vertex>",
    "}"

    "#include <logdepthbuf_pars_fragment>",
    "uniform float uSoft;",
    "varying vec3 vColor;",
    "varying float vAlpha;",
    "void main() {",
    "  vec2 c = gl_PointCoord - 0.5;",

    "  #include <logdepthbuf_fragment>",
    "}"

  /* =========================================================
     BEYOND THE PLANETS
     Everything is squeezed, just like the planets.
     The Sun stays at the centre of the scene; the galaxy moves around it.
     ========================================================= */
  var LY = 80;                                // galaxy scale: 80 units per light-year
  var GAL_R = 50000 * LY;                     // galaxy radius
  var SUN_GAL_R = 26000 * LY;                 // Sun's distance from the galaxy centre
  var GAL_YEAR = 230e6 * 365.25;              // days for one trip around the galaxy
  var BOB_PERIOD = 64e6 * 365.25;             // days for one bob up and down through the disc
  var BOB_AMP = 250 * LY;                     // how far above/below the disc the Sun goes
  var ARM_PERIOD = 260e6 * 365.25;            // the spiral pattern turns a bit slower than the Sun
  var PITCH = Math.tan(12 * DEG);             // how tightly the arms wind
  var BAR_R = 0.24 * GAL_R;                   // arms start at the ends of the central bar
  var HELIO_R = 700;                          // edge of the heliosphere (nose side)
  var OORT_R = 46000;                         // outer edge of the Oort cloud

  // A real direction in the sky, from ecliptic longitude and latitude (degrees).
  // The planets orbit in the ecliptic, which is this scene's flat plane.
  function eclDir(lonDeg, latDeg, r) {
    var l = lonDeg * DEG, b = latDeg * DEG;
    return new THREE.Vector3(Math.cos(b) * Math.cos(l), Math.sin(b), -Math.cos(b) * Math.sin(l)).multiplyScalar(r || 1);
  }
  var GAL_CENTRE_DIR = eclDir(266.84, -5.54);  // towards Sagittarius
  var GAL_NORTH = eclDir(180.02, 29.81);       // galaxy's north pole: 60° from the planets' north
  var HELIO_NOSE = eclDir(255.4, 5.2);         // where the interstellar wind comes from
  var V1_POS = eclDir(255.6, 34.8, 840);       // Voyager 1's real direction
  var V2_POS = eclDir(290.1, -36.6, 705);      // Voyager 2's real direction

  // Angle of a spiral arm at radius r (arms trail behind as the galaxy turns)
  function armAngle(r, a0) { return a0 - Math.log(r / BAR_R) / PITCH; }
  // The Sun sits between two arms, on the small Orion Spur
  var SUN_ARM_ANGLE = armAngle(SUN_GAL_R, 0) + Math.PI / 4;

  // Where the Sun is in the galaxy on a given day
  function sunGalPos(days, out) {
    var t = days - startDays;
    var th = SUN_ARM_ANGLE + TAU * t / GAL_YEAR;
    // Galaxy +Y is its south pole (see galaxyTilt). Today the Sun is a little north of the disc, heading further north.
    var y = -BOB_AMP * Math.sin(0.222 + TAU * t / BOB_PERIOD);
    return out.set(SUN_GAL_R * Math.cos(th), y, -SUN_GAL_R * Math.sin(th));
  }

  // Turns the galaxy so it sits at its real angle to the planets' orbits
  function galaxyTilt() {
    // Galaxy's own axes: towards the centre (from the Sun, today), spin axis, and a third at right angles
    var th = SUN_ARM_ANGLE;
    var e1 = new THREE.Vector3(-Math.cos(th), 0, Math.sin(th)), e2 = new THREE.Vector3(0, 1, 0), e3 = e1.clone().cross(e2);
    // The same axes in the sky. The galaxy spins clockwise seen from its north pole, so its spin axis points south.
    var f2 = GAL_NORTH.clone().negate();
    var f1 = GAL_CENTRE_DIR.clone().addScaledVector(f2, -GAL_CENTRE_DIR.dot(f2)).normalize(), f3 = f1.clone().cross(f2);
    var mE = new THREE.Matrix4().makeBasis(e1, e2, e3), mF = new THREE.Matrix4().makeBasis(f1, f2, f3);
    return new THREE.Quaternion().setFromRotationMatrix(mF.multiply(mE.transpose()));
  }

  var big = {}; // handles to everything built below
  function gaussFn(r) { return function () { return Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(TAU * r()); }; }
  function pickFn(r) { return function (list) { return list[Math.floor(r() * list.length)]; }; }

  function buildBelts() {

      push(kb, rad * Math.cos(th), gauss() * 7, -rad * Math.sin(th), c01(pick(["#A9BCD8", "#D2DDEE", "#93A6C6"]), 1), 1.8 + r() * 1.8);

  // A sphere stretched into a comet shape: round nose (+X), long tail (−X)
  function bubbleGeometry() {
    var g = new THREE.SphereGeometry(1, 72, 48), p = g.attributes.position;
    for (var i = 0; i < p.count; i++) {
      var x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      if (x < 0) { var t = -x, k = 1 + 0.25 * t; x = -t * (1 + 1.8 * t * t); y *= k; z *= k; }
      else x *= 0.85;
      p.setXYZ(i, x, y, z);
    }
    g.computeVertexNormals();
    return g;
  }

  function buildHeliosphere() {
    var g = new THREE.Group(), geo = bubbleGeometry();
    big.helioEdge = new THREE.Mesh(geo, shellMaterial("#FFA24A", 0.6, 2.4));
    big.helioEdge.scale.setScalar(HELIO_R);
    big.helioShock = new THREE.Mesh(geo, shellMaterial("#4FC3FF", 0.3, 3));

    big.voyagers = [V1_POS, V2_POS].map(function (p) {
      var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: vt, sizeAttenuation: false, depthTest: false, transparent: true }));

  function buildOort() {
    var r = rng(777), b = newBuf(), hz = newBuf(), g = new THREE.Group();
    // A random spot in the cloud; the inner part is flatter, like a thick doughnut
    function oortSpot(inner) {
      var rad = inner ? 6000 + 10000 * r() : 16000 + (OORT_R - 16000) * Math.pow(r(), 0.7);
      var th = r() * TAU, ph = Math.acos(2 * r() - 1);
      return [rad * Math.sin(ph) * Math.cos(th), rad * Math.cos(ph) * (inner ? 0.35 : 1), rad * Math.sin(ph) * Math.sin(th)];
    }
    for (var i = 0; i < 40000; i++) {
      var p = oortSpot(i < 13000);
      push(b, p[0], p[1], p[2], c01(r() < 0.5 ? "#C9D8F0" : "#EEF3FB", 1), 150 + r() * 200);
    }
    // Soft haze so it looks like a cloud, not just dots
    for (i = 0; i < 1500; i++) {
      p = oortSpot(i < 400);
      push(hz, p[0], p[1], p[2], c01(r() < 0.5 ? "#5E7FC8" : "#7A8FD6", 0.08), 6000 + r() * 6000);
    }
    big.oortHaze = makePoints(hz, pointsMaterial({ maxPx: 160, soft: true }));
    big.oortPts = makePoints(b, pointsMaterial({ maxPx: 4 }));
    big.oortShell = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), shellMaterial("#7F9CE6", 0.5, 2.2));
    big.oortShell.scale.setScalar(OORT_R);
    big.oortShell.raycast = noPick;
    g.add(big.oortHaze); g.add(big.oortPts); g.add(big.oortShell);
    big.oort = g;
    scene.add(g);
  }

  function buildGalaxy() {
    var r = rng(4242), gauss = gaussFn(r), pick = pickFn(r);
    var stars = newBuf(), glow = newBuf(), dust = newBuf();
    var WARM = ["#FFE6B8", "#FFD08A", "#FFB870", "#FFF1DA"];
    var BLUE = ["#A9C4FF", "#C9DAFF", "#E4ECFF", "#FFF6EC"];
    var HAZE = ["#4F7BFF", "#6C8CFF", "#8A6CFF", "#5AA0FF"];
    var i, rad, th, u, sp, x, z;
    function armRadius() { return BAR_R * Math.exp(Math.pow(r(), 0.9) * Math.log(1.05 * GAL_R / BAR_R)); }

    // Central bulge: old, yellow stars
    for (i = 0; i < 22000; i++) push(stars, gauss() * 0.07 * GAL_R, gauss() * 0.045 * GAL_R, gauss() * 0.07 * GAL_R, c01(pick(WARM), 0.9), 2600 + r() * 2600);
    // Central bar
    for (i = 0; i < 16000; i++) {
      u = Math.max(-1, Math.min(1, gauss() * 0.5));
      push(stars, u * BAR_R, gauss() * 0.035 * GAL_R, gauss() * 0.18 * BAR_R * (1 - Math.abs(u) * 0.5), c01(pick(WARM), 0.85), 2400 + r() * 2400);
    }
    // Faint disc between the arms
    for (i = 0; i < 30000; i++) {
      rad = Math.min(1.1 * GAL_R, -0.3 * GAL_R * Math.log(r() + 1e-9)); th = r() * TAU;
      push(stars, rad * Math.cos(th), gauss() * 0.008 * GAL_R, -rad * Math.sin(th), c01(r() < 0.5 ? "#FFF1DA" : "#CFDBFF", 0.55), 1800 + r() * 1600);
    }
    // Four spiral arms: two big ones and two smaller ones
    [[0, 1], [Math.PI / 2, 0.6], [Math.PI, 1], [Math.PI * 1.5, 0.6]].forEach(function (arm) {
      var n = Math.round(34000 * arm[1]);
      for (i = 0; i < n; i++) {
        rad = armRadius(); th = armAngle(rad, arm[0]); sp = 0.04 * rad;
        x = rad * Math.cos(th) + gauss() * sp; z = -rad * Math.sin(th) + gauss() * sp;
        var y = gauss() * 0.006 * GAL_R * (1 + rad / GAL_R), fade = 0.55 + 0.45 * (1 - rad / GAL_R);
        if (r() < 0.03) push(stars, x, y, z, c01("#FF6FA8", 1), 7000 + r() * 5000); // pink star-forming clouds
        else push(stars, x, y, z, c01(r() < 0.8 ? pick(BLUE) : pick(WARM), fade), 2000 + r() * 2600);
      }
      // Blue haze along the arm
      for (i = 0; i < Math.round(1200 * arm[1]); i++) {
        rad = armRadius(); th = armAngle(rad, arm[0]); sp = 0.05 * rad;
        push(glow, rad * Math.cos(th) + gauss() * sp, gauss() * 0.004 * GAL_R, -rad * Math.sin(th) + gauss() * sp,
          c01(pick(HAZE), 0.1 * (0.5 + 0.5 * (1 - rad / GAL_R))), 1.6e5 + r() * 1.6e5);
      }
      // Dark dust lanes on the inside edge of the arm
      for (i = 0; i < Math.round(1000 * arm[1]); i++) {

    }
    for (i = 0; i < 250; i++) {
      rad = SUN_GAL_R * (0.86 + 0.28 * r()); th = SUN_ARM_ANGLE - Math.log(rad / SUN_GAL_R) / PITCH; sp = 0.025 * rad;
      push(glow, rad * Math.cos(th) + gauss() * sp, gauss() * 0.003 * GAL_R, -rad * Math.sin(th) + gauss() * sp, c01(pick(HAZE), 0.06), 1.2e5 + r() * 1e5);
    }
    // Warm glow around the centre
    for (i = 0; i < 600; i++) push(glow, gauss() * 0.06 * GAL_R, gauss() * 0.03 * GAL_R, gauss() * 0.06 * GAL_R, c01(pick(WARM), 0.09), 2.5e5 + r() * 2.5e5);

    var root = new THREE.Group(), arms = new THREE.Group();
    var glowPts = makePoints(glow, pointsMaterial({ maxPx: 160, near0: 1.2e5, near1: 5e5, soft: true }));
    var starPts = makePoints(stars, pointsMaterial({ maxPx: 6, near0: 3e4, near1: 1.5e5 }));
    var dustPts = makePoints(dust, pointsMaterial({ maxPx: 160, near0: 1.2e5, near1: 5e5, soft: true, blending: THREE.NormalBlending, opacity: 0.5 }));
    glowPts.renderOrder = 1; starPts.renderOrder = 2; dustPts.renderOrder = 3;
    arms.add(glowPts); arms.add(starPts); arms.add(dustPts);
    big.galaxyMats = [glowPts.material, starPts.material, dustPts.material];

    var core = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(glowTexture()), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85 }));
    core.scale.set(1.5e6, 1.5e6, 1);
    core.raycast = noPick;
    arms.add(core);
    big.core = core;
    root.add(arms);

    // Glowing trail showing the Sun's path over its last trip around the galaxy
    var N = 720, tp = new Float32Array(N * 3), tc = new Float32Array(N * 3);
    for (i = 0; i < N; i++) {

    trail.frustumCulled = false;
    trail.raycast = noPick;
    root.add(trail);

    big.galaxy = root; big.arms = arms; big.trail = trail;
    big.galaxyFrame = new THREE.Group();
    big.galaxyFrame.quaternion.copy(galaxyTilt());
    big.galaxyFrame.add(root);
    scene.add(big.galaxyFrame);

    // "You are here" marker, always the same size on screen
    var mark = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex(ringMarkerTexture()), sizeAttenuation: false, depthTest: false, transparent: true }));
    mark.scale.set(0.045, 0.045, 1);
    mark.renderOrder = 10;
    scene.add(mark);
    big.marker = mark;
  }

  /* =========================================================

  var startDays = (Date.now() - J2000) / DAY_MS;

  var MAX_STEP = 0.15;  // biggest spin per frame, so fast speeds don't look jumpy
  var MAX_ORBIT = 0.35; // biggest orbit step per frame

  function clampStep(x) { return x > MAX_STEP ? MAX_STEP : x < -MAX_STEP ? -MAX_STEP : x; }

  // exact = put every planet exactly where it belongs on this date
  function advance(days, exact) {
    simDays += days;
    PLANETS.forEach(function (p) {
      // Planets follow the real date, unless time is so fast they'd just flicker
      var target = p.L0 * DEG + TAU * (simDays / p.period);
      var step = TAU * days / p.period;
      if (exact || p.angle == null || Math.abs(step) <= MAX_ORBIT) p.angle = target;
      else p.angle += step > 0 ? MAX_ORBIT : -MAX_ORBIT;
      p.holder.position.set(Math.cos(p.angle) * p.dist, 0, -Math.sin(p.angle) * p.dist);
    });

    big.kuiper.rotation.y += clampStep(TAU * days / 90000);

    // The galaxy moves around us, so the Sun can stay at the centre of the scene
    big.galaxy.position.copy(sunGalPos(simDays, galV)).negate();
    big.arms.rotation.y = TAU * (simDays - startDays) / ARM_PERIOD;

    SUN.mesh.rotation.y += clampStep(TAU * days * 24 / SUN.rotH);
    PLANETS.forEach(function (p) {
      var spin = clampStep(TAU * days * 24 / p.rotH);
      p.mesh.rotation.y += spin;
      if (p.clouds) p.clouds.rotation.y += spin * 1.08;

  var UP = new THREE.Vector3(0, 1, 0);

  function viewDistance(b) {
    if (b.view) return b.view.dist;

  }

  // The flight zooms in "powers of ten", so going from Earth to the whole galaxy feels smooth
  function startFly(getEnd, body) {
    var end = getEnd();
    var fromOff = camera.position.clone().sub(controls.target);
    var endOff = end.pos.clone().sub(end.target);
    var d0 = Math.max(1e-3, fromOff.length()), d1 = Math.max(1e-3, endOff.length());
    var zoom = Math.abs(Math.log(d1 / d0));                 // how many "zoom steps" apart
    var hopRatio = controls.target.distanceTo(end.target) / Math.max(d0, d1);
    fly = {
      t: 0, getEnd: getEnd, body: body,
      fromTarget: controls.target.clone(),
      dir0: fromOff.normalize(),
      d0: d0,
      zoom: zoom,
      blend: smooth(0.7, 2.5, zoom),                          // 0 = short hop, 1 = big zoom
      hop: Math.min(6, hopRatio * 0.4),                       // pull back a little on long hops
      dur: reduceMotion ? 0.01 : Math.min(4.5, 1.4 + zoom * 0.22 + Math.min(1.2, hopRatio * 0.04))

    controls.enabled = false;

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  var flyDir = new THREE.Vector3();
  function stepFly(dt) {

    var endOff = end.pos.clone().sub(end.target), d1 = Math.max(1e-3, endOff.length());

    // Distance changes smoothly on a log scale

    var wZoom = Math.abs(d1 - fly.d0) > 1e-6 ? (dist - fly.d0) / (d1 - fly.d0) : k;
    var w = k + (wZoom - k) * fly.blend;
    controls.target.lerpVectors(fly.fromTarget, end.target, w);

    flyDir.copy(fly.dir0).lerp(endOff.normalize(), k);
    if (flyDir.lengthSq() < 1e-6) flyDir.set(0, 1, 0);
    flyDir.normalize();
    dist *= 1 + fly.hop * Math.sin(Math.PI * k) * (1 - fly.blend);
    camera.position.copy(controls.target).addScaledVector(flyDir, dist);

    controls.target.x += dx; controls.target.y += dy; controls.target.z += dz;

  // Keyboard + fly pad
  var keys = {}, padHeld = {};
  function stepKeys(dt) {
    var f = 0, r = 0, u = 0;
    if (keys.KeyW || keys.ArrowUp || padHeld.f) f += 1;
    if (keys.KeyS || keys.ArrowDown || padHeld.b) f -= 1;
    if (keys.KeyD || keys.ArrowRight || padHeld.r) r += 1;
    if (keys.KeyA || keys.ArrowLeft || padHeld.l) r -= 1;
    if (keys.KeyE || keys.PageUp || padHeld.u) u += 1;
    if (keys.KeyQ || keys.PageDown || padHeld.d) u -= 1;

    if (follow) { follow = null; controls.minDistance = 0.5; }
    stopTour();
    setOverviewBtn(false);

    var fwd = controls.target.clone().sub(camera.position).normalize();
    var right = fwd.clone().cross(UP).normalize();
    var boost = (keys.ShiftLeft || keys.ShiftRight) ? 4 : 1;
    var spd = boost * Math.max(10, camera.position.distanceTo(controls.target) * 0.8);

        : "The Sun has gone round the galaxy <b>" + trips.toFixed(1) + " times</b>";
    } else {
      var dt = new Date(J2000 + simDays * DAY_MS);
      txt = dt.getFullYear() < 1 || dt.getFullYear() > 9999 ? "Year " + dt.getFullYear() : dt.toLocaleDateString(undefined, fmt);
    }
    if (txt !== lastDateTxt) { dateEl.textContent = txt; lastDateTxt = txt; }

    if (when) { /* already set */ }
    else if (a < 1) when = "Today";
    else {
      var parts = [];
      if (yrs) parts.push(yrs.toLocaleString("en") + (yrs === 1 ? " year" : " years"));
      if (days || !yrs) parts.push(days + (days === 1 ? " day" : " days"));
      when = "<b>" + parts.join(", ") + "</b> " + (diff > 0 ? "in the future" : "in the past");
    }
    var state = !playing ? " · Paused" : "";
    when += state;
    if (when !== lastWhenTxt) { whenEl.innerHTML = when; lastWhenTxt = when; }
  }

  // Transport controls
  var btnPlay = document.getElementById("btnPlay"), btnBack = document.getElementById("btnBack"), btnFwd = document.getElementById("btnFwd");
  var icoPlay = document.getElementById("icoPlay"), icoPause = document.getElementById("icoPause");

  function refreshTransport() {
    icoPlay.hidden = playing; icoPause.hidden = !playing;
    btnPlay.setAttribute("aria-label", playing ? "Pause" : "Play");
    btnBack.setAttribute("aria-pressed", String(playing && dir < 0));
    btnFwd.setAttribute("aria-pressed", String(playing && dir > 0));
  }
  function togglePlay() { playing = !playing; refreshTransport(); }

  btnPlay.addEventListener("click", togglePlay);
  btnBack.addEventListener("click", function () { dir = -1; playing = true; refreshTransport(); });
  btnFwd.addEventListener("click", function () { dir = 1; playing = true; refreshTransport(); });
  document.getElementById("btnToday").addEventListener("click", function () {
    advance(startDays - simDays, true);
    dir = 1; refreshTransport();
  });

  // Speed stepper: how much time passes each real second
  var SPEEDS = [
    [1 / 24, "1 hour"], [1, "1 day"], [7, "1 week"], [30.44, "1 month"], [365.25, "1 year"],
    [36525, "100 years"], [3652500, "10,000 years"], [365.25e6, "1 million years"], [3652.5e6, "10 million years"]
  ];
  var speedI = 2;
  var btnSlower = document.getElementById("btnSlower"), btnFaster = document.getElementById("btnFaster");
  var speedTxt = document.getElementById("speedTxt");
  function setSpeed(i) {
    speedI = Math.max(0, Math.min(SPEEDS.length - 1, i));
    speed = SPEEDS[speedI][0];
    speedTxt.textContent = "1 sec = " + SPEEDS[speedI][1];
    btnSlower.disabled = speedI === 0;
    btnFaster.disabled = speedI === SPEEDS.length - 1;
    if (!playing) { playing = true; refreshTransport(); }
  }
  btnSlower.addEventListener("click", function () { setSpeed(speedI - 1); });
  btnFaster.addEventListener("click", function () { setSpeed(speedI + 1); });
  btnSlower.disabled = false; btnFaster.disabled = false;

  // Toggles
  var btnOrbits = document.getElementById("btnOrbits"), btnNames = document.getElementById("btnNames"), btnOverview = document.getElementById("btnOverview");
  btnOrbits.addEventListener("click", function () {
    showOrbits = !showOrbits;
    btnOrbits.setAttribute("aria-pressed", String(showOrbits));
    PLANETS.forEach(function (p) { p.orbit.visible = showOrbits; p.moons.forEach(function (m) { m.orbit.visible = showOrbits; }); });
  });
  btnNames.addEventListener("click", function () {
    showNames = !showNames;
    btnNames.setAttribute("aria-pressed", String(showNames));
  });
  function setOverviewBtn(on) { btnOverview.setAttribute("aria-pressed", String(on)); }
  btnOverview.addEventListener("click", goOverview);
  btnTour.addEventListener("click", function () { if (touring) stopTour(); else startTour(); });

  // Keyboard
  window.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    if (e.code === "Space") {
      if (t && t.tagName === "BUTTON") return; // let the button handle it
      e.preventDefault(); togglePlay(); return;
    }
    if (e.code === "Escape") { closeCard(); return; }
    keys[e.code] = true;
    if (/^Arrow|^Page/.test(e.code)) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = {}; padHeld = {}; });

  // Fly pad (hold to move)
  Array.prototype.forEach.call(document.querySelectorAll("#pad [data-dir]"), function (btn) {
    var d = btn.getAttribute("data-dir");
    function on(e) { e.preventDefault(); padHeld[d] = true; btn.classList.add("held"); try { btn.setPointerCapture(e.pointerId); } catch (_) {} }
    function off() { padHeld[d] = false; btn.classList.remove("held"); }
    btn.addEventListener("pointerdown", on);
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("lostpointercapture", off);
  });

  // Click a planet in 3D to visit it
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), pickables = [];
  function pick(ev) {
    var r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.body : null;
  }
  var downAt = null;
  renderer.domElement.addEventListener("pointerdown", function (e) { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  renderer.domElement.addEventListener("pointerup", function (e) {
    if (!downAt) return;
    var moved = Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y);
    if (moved < 6 && performance.now() - downAt.t < 500) {
      var b = pick(e);
      if (b) visit(b);
    }
    downAt = null;
  });
  renderer.domElement.addEventListener("pointermove", function (e) {
    if (e.buttons) return;
    renderer.domElement.style.cursor = pick(e) ? "pointer" : "grab";
  });
  // Scrolling or dragging while flying hands control back to the viewer
  renderer.domElement.addEventListener("wheel", function () { if (fly) { fly = null; controls.enabled = true; } }, { passive: true });

  // Keep the info card clear of the bottom controls
  var transportEl = document.getElementById("transport"), padEl = document.getElementById("pad");
  function syncDock() {
    var root = document.documentElement;
    // Width the planet bar needs on one row
    var need = 10;
    Array.prototype.forEach.call(chipsEl.children, function (c) { need += c.offsetWidth + (c.className === "chip-sep" ? 10 : 2); });
    var side = Math.max(transportEl.offsetWidth, padEl.offsetWidth) + 28;
    root.classList.toggle("corners-low", need + 2 * side <= window.innerWidth);
    root.style.setProperty("--chips-h", chipsEl.offsetHeight + "px");
    root.style.setProperty("--dock-h", Math.max(0, window.innerHeight - transportEl.getBoundingClientRect().top) + "px");
  }
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(syncDock);
    ro.observe(chipsEl); ro.observe(transportEl);
  }
  syncDock();

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    var s = pxScale();
    pointMats.forEach(function (m) { m.uniforms.uScale.value = s; });
    syncDock();
  });

  /* =========================================================
     MAIN LOOP
     ========================================================= */
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (playing) advance(dt * speed * dir);
    scene.updateMatrixWorld();

    if (fly) stepFly(dt);
    else { followStep(); stepKeys(dt); controls.update(); }
    tourStep(dt);
    updateScales();

    renderer.render(scene, camera);
    updateLabels();
    updateClock();
    requestAnimationFrame(loop);
  }

  // Build after the loading message has painted
  setTimeout(function () {
    build();
    pickables = bodies.filter(function (b) { return b.kind !== "region"; }).map(function (b) { return b.mesh; });
    buildChips();
    buildLabels();
    advance(0, true);
    refreshTransport();
    // A link ending in #milkyway, #oort, #saturn… opens at that place
    var start = byId[location.hash.slice(1)];
    if (start) visit(start); else select(byId.earth);
    loadingEl.hidden = true;
    requestAnimationFrame(function (t) { last = t; loop(t); });
  }, 30);
})();
</script>
